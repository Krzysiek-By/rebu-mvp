<!DOCTYPE html>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>REBU MVP</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#166534;--warn:#92400e;--danger:#991b1b;--accent:#111827;--soft:#f3f4f6}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}header{position:sticky;top:0;z-index:10;background:rgba(246,247,249,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.5px}.pill{font-size:12px;padding:6px 9px;border-radius:999px;background:#e5e7eb}.screen{padding:16px 16px 100px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h1{font-size:28px;margin:8px 0 8px}h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;cursor:pointer;background:var(--accent);color:#fff;width:100%}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.ghost{background:var(--soft);color:var(--ink)}.danger{background:#b91c1c}.ok{background:#166534}.mini{padding:9px 11px;font-size:13px;width:auto;border-radius:10px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:100px;resize:vertical}label{display:grid;gap:6px;font-size:14px;font-weight:650}.hint{font-size:12px;color:var(--muted);font-weight:400}.status{padding:10px 12px;border-radius:12px;background:#eef2ff;font-weight:700;font-size:14px}.status.okay{background:#ecfdf5;color:#166534}.status.warn{background:#fffbeb;color:#92400e}.status.bad{background:#fef2f2;color:#991b1b}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{background:transparent;color:#374151;padding:9px 4px;font-size:12px}.nav button.active{color:#000;font-weight:800}
.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#f3f4f6;font-size:12px;margin:2px 4px 2px 0}.job{border-left:4px solid #111827}.sep{height:1px;background:var(--line);margin:12px 0}.timeline{display:grid;gap:10px}.tl{display:flex;gap:10px}.dot{width:11px;height:11px;border-radius:50%;background:#111827;margin-top:5px;flex:none}.dot.off{background:#d1d5db}.money{font-size:26px;font-weight:800}.top-space{margin-top:8px}.hide{display:none!important}.center{text-align:center}.emoji{font-size:44px}.notice{padding:12px;border-radius:12px;background:#f9fafb;border:1px dashed #d1d5db;font-size:13px}.link{color:#111827;text-decoration:underline;cursor:pointer}
@media(max-width:460px){h1{font-size:25px}.screen{padding:14px 12px 96px}.card{border-radius:16px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">REBU <span class="muted">MVP</span></div><div id="rolePill" class="pill">tryb testowy</div></header>
<main id="main"></main>
<div id="nav" class="nav hide"></div>
</div>

  needQuestion:'Brauchst du Hilfe?', activeJob:'Aktiver Auftrag', howWorks:'So funktioniert REBU', step1:'Du beschreibst einen kurzen Auftrag', step2:'Du wählst einen interessierten Helfer', step3:'Arbeit, Bestätigung und Zahlung in der App',
  available:'Ich bin verfügbar', visibility:'Sichtbar für passende Aufträge', yourActive:'Dein aktiver Auftrag', availableJobs:'Verfügbare Aufträge', noJobs:'Keine neuen passenden Aufträge.', interested:'ICH BIN INTERESSIERT',

function t(k){return (I18N[S.lang||'pl']||I18N.pl)[k]||I18N.pl[k]||k}
function setLang(l){S.lang=l;save();document.documentElement.lang=l;render()}
function reset(){localStorage.removeItem(KEY);S={...defaultState};render()}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function money(n){return Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'EUR'})}
function job(){return S.jobs.find(j=>j.id===S.currentJobId)||S.jobs[0]}
function setRole(r){S.role=r;save();render()}
function bottom(active){
 const items=S.role==='client'?[['start',t('start')],['jobs',t('jobs')],['msg',t('messages')],['profile',t('profile')]]:[['start',t('start')],['jobs',t('jobs')],['earn',t('earnings')],['profile',t('profile')]];
 nav.classList.remove('hide');nav.innerHTML=items.map(([id,label])=>`<button class="${active===id?'active':''}" onclick="route('${id}')">${label}</button>`).join('')
}
function route(r){if(r==='start') return home(); if(r==='jobs') return jobsView(); if(r==='profile') return profile(); if(r==='earn') return earnings(); if(r==='msg') return messages();}
function render(){
 document.documentElement.lang=S.lang||'pl';
 rolePill.textContent=S.role==='client'?t('client'):S.role==='helper'?t('helper'):t('test');
 if(!S.lang)return welcome();
 if(!S.user)return onboarding();
 if(!S.role)return chooseRole();
 home();
}
function welcome(){nav.classList.add('hide');main.innerHTML=`<section class="screen" style="display:grid;min-height:calc(100vh - 64px);align-content:center"><div class="center"><div style="font-size:54px;font-weight:900;letter-spacing:2px">REBU</div><h1 style="margin-top:14px">${t('slogan')}</h1><p class="muted">${t('chooseLang')}</p></div><div class="card stack" style="margin-top:18px"><button onclick="setLang('de')">Deutsch</button><button class="secondary" onclick="setLang('en')">English</button><button class="secondary" onclick="setLang('pl')">Polski</button><div class="notice center">${t('registeredOnly')}</div></div></section>`}
function onboarding(){nav.classList.add('hide');main.innerHTML=`<section class="screen"><div class="center"><div class="emoji">🤝</div><h1>${t('slogan')}</h1></div><div class="card stack"><h2>${t('createTest')}</h2><label>${t('firstName')}<input id="firstName" placeholder="${S.lang==='de'?'z. B. Alex':S.lang==='en'?'e.g. Alex':'np. Alex'}"></label><label>${t('lastName')}<input id="lastName" placeholder="${S.lang==='de'?'z. B. Müller':S.lang==='en'?'e.g. Miller':'np. Kowalski'}"></label><label>${t('email')}<input id="email" type="email" placeholder="alex@example.com"></label><label>${t('phone')}<input id="phone" placeholder="+49..."></label><label>${t('city')}<input id="city" placeholder="Bad Tölz"></label><button onclick="register()">${t('createAccount')}</button><div class="notice">${t('regNote')}</div><button class="ghost" onclick="S.lang=null;save();render()">${t('changeLanguage')}</button></div></section>`}
function register(){const firstName=document.querySelector('#firstName').value.trim();const lastName=document.querySelector('#lastName').value.trim();if(!firstName)return alert(t('needFirst'));if(!lastName)return alert(t('needLast'));S.user={firstName,lastName,name:firstName+' '+lastName,email:email.value,phone:phone.value,city:city.value||'Bad Tölz',verified:true};save();chooseRole()}
function chooseRole(){nav.classList.add('hide');main.innerHTML=`<section class="screen"><h1>${t('hello')}, ${esc(S.user.firstName||S.user.name)}</h1><p class="muted">${t('chooseAction')}</p><div class="card stack"><button onclick="setRole('client')">${t('needHelp')}</button><button class="secondary" onclick="setRole('helper')">${t('earnHelp')}</button></div><div class="card"><h3>${t('oneAccount')}</h3><p class="muted small">${t('roleHint')}</p></div></section>`}
function home(){bottom('start');if(S.role==='client')clientHome();else helperHome()}
function clientHome(){const active=S.jobs.find(j=>!['completed','cancelled'].includes(j.status));main.innerHTML=`<section class="screen"><h1>${t('needQuestion')}</h1><button onclick="createJob()">+ ${t('needHelp').toUpperCase()}</button>${active?`<div class="card top-space"><h2>${t('activeJob')}</h2>${jobCard(active,true)}</div>`:''}<div class="card"><h3>${t('howWorks')}</h3><div class="timeline small"><div class="tl"><span class="dot"></span><div>${t('step1')}</div></div><div class="tl"><span class="dot"></span><div>${t('step2')}</div></div><div class="tl"><span class="dot"></span><div>${t('step3')}</div></div></div></div></section>`}
function helperHome(){const available=S.jobs.filter(j=>['published','searching'].includes(j.status));const mine=S.jobs.find(j=>j.helper===S.user.name&&!['completed','cancelled'].includes(j.status));main.innerHTML=`<section class="screen"><div class="card row between"><div><h2 style="margin:0">${t('available')}</h2><div class="muted small">${t('visibility')}</div></div><button class="mini ${S.helperAvailable?'ok':'ghost'}" onclick="toggleAvail()">${S.helperAvailable?'ON':'OFF'}</button></div>${mine?`<div class="card"><h2>${t('yourActive')}</h2>${jobCard(mine,true)}</div>`:''}<h2>${t('availableJobs')}</h2>${available.length?available.map(j=>`<div class="card job">${jobCard(j,false)}<button onclick="interest('${j.id}')" ${!S.helperAvailable?'disabled':''}>${t('interested')}</button></div>`).join(''):`<div class="card center muted">${t('noJobs')}</div>`}</section>`}
function toggleAvail(){S.helperAvailable=!S.helperAvailable;save();helperHome()}
function createJob(){bottom('jobs');main.innerHTML=`<section class="screen"><h1>Nowe zlecenie</h1><div class="card stack"><label>Kategoria<select id="cat"><option>Pomoc przy meblach</option><option>Ogród</option><option>Prosta pomoc domowa</option><option>Pomoc techniczna</option><option>Odbiór / dostarczenie rzeczy</option></select></label><label>Opisz czego potrzebujesz<textarea id="desc" placeholder="Np. potrzebuję znieść szafę z 1. piętra do piwnicy"></textarea><span class="hint">AI w wersji produkcyjnej dopyta o brakujące informacje zależnie od kategorii.</span></label><div class="grid2"><label>Kiedy<select id="when"><option>Teraz</option><option>Dzisiaj</option><option>Jutro</option></select></label><label>Przewidywany czas<select id="duration"><option>15–30 min</option><option>30–60 min</option><option>1–2 h</option><option>2–3 h</option></select></label></div><label>Adres<input id="address" placeholder="ulica, miejscowość" value="${esc(S.user.city)}"></label><label>Proponowana cena (€)<input id="price" type="number" min="5" step="1" value="29"></label><div class="notice">GREEN/YELLOW/RED: na tym etapie symulacja. Dokładny adres zobaczy dopiero wybrany i potwierdzony wykonawca.</div><button onclick="publishJob()">OPUBLIKUJ ZLECENIE</button><button class="secondary" onclick="home()">Anuluj</button></div></section>`}
function publishJob(){if(!desc.value.trim())return alert('Dodaj opis zlecenia');const id='J'+Date.now();const j={id,client:S.user.name,category:cat.value,desc:desc.value.trim(),when:when.value,duration:duration.value,address:address.value,price:Number(price.value),status:'published',interested:[],helper:null,events:[['Opublikowano zlecenie',Date.now()]],payment:'authorized'};S.jobs.unshift(j);S.currentJobId=id;save();jobDetail(id)}
function jobCard(j,open){return `<div><div class="row between"><strong>${esc(j.category)}</strong><span class="tag">${esc(statusLabel(j.status))}</span></div><p>${esc(j.desc)}</p><div class="small muted">${esc(j.when)} • ${esc(j.duration)} • ${S.role==='helper'&&!j.helper?'okolica '+esc((j.address||'').split(',').pop()):esc(j.address)}</div><div class="row between top-space"><span class="money">${money(j.price)}</span>${open?`<button class="mini secondary" onclick="jobDetail('${j.id}')">Otwórz</button>`:''}</div></div>`}
function statusLabel(s){return ({published:t('searching'),searching:t('searching'),selected:t('selected'),confirmed:t('confirmed'),enroute:t('enroute'),onsite:t('onsite'),inprogress:t('inprogress'),awaiting:t('awaiting'),completed:t('completed'),cancelled:t('cancelled'),dispute:t('problem')})[s]||s}
function interest(id){const j=S.jobs.find(x=>x.id===id);if(!j)return;if(!j.interested.includes(S.user.name))j.interested.push(S.user.name);j.events.push(['Wykonawca zgłosił zainteresowanie',Date.now()]);save();alert(t('sent'));helperHome()}
function jobsView(){bottom('jobs');main.innerHTML=`<section class="screen"><h1>Zlecenia</h1>${S.jobs.length?S.jobs.map(j=>`<div class="card">${jobCard(j,true)}</div>`).join(''):`<div class="card muted center">Brak zleceń.</div>`}</section>`}
function jobDetail(id){S.currentJobId=id;save();const j=S.jobs.find(x=>x.id===id);if(!j)return home();bottom('jobs');let actions='';if(S.role==='client')actions=clientActions(j);else actions=helperActions(j);main.innerHTML=`<section class="screen"><div class="row between"><h1 style="margin-bottom:12px">Zlecenie</h1><span class="tag">${j.id}</span></div><div class="card">${jobCard(j,false)}</div><div class="status ${['completed'].includes(j.status)?'okay':''}">${statusLabel(j.status)}</div><div class="card top-space"><h3>Przebieg</h3><div class="timeline">${j.events.map((e,i)=>`<div class="tl"><span class="dot"></span><div><strong>${esc(e[0])}</strong><div class="muted small">${new Date(e[1]).toLocaleString('pl-PL')}</div></div></div>`).join('')}</div></div>${candidateBlock(j)}${actions}<div class="card"><h3>Płatność – tryb testowy</h3><div class="row between"><span>Status</span><strong>${esc(j.payment||'—')}</strong></div><div class="row between"><span>Kwota</span><strong>${money(j.price)}</strong></div><div class="notice top-space">Realny operator płatności nie jest jeszcze podłączony. Ten ekran służy do testowania logiki.</div></div></section>`}
function candidateBlock(j){if(S.role!=='client'||!['published','searching','selected'].includes(j.status))return '';if(!j.interested.length)return `<div class="card"><h3>Zainteresowani</h3><p class="muted">Jeszcze nikt się nie zgłosił.</p></div>`;return `<div class="card"><h3>Zainteresowani</h3>${j.interested.map(n=>`<div class="row between"><div><strong>${esc(n)}</strong><div class="small muted">⭐ 5.0 • 0 zleceń • niezawodność 100%</div></div><button class="mini" onclick="selectHelper('${j.id}','${esc(n)}')">WYBIERZ</button></div>`).join('<div class="sep"></div>')}</div>`}
function selectHelper(id,n){const j=S.jobs.find(x=>x.id===id);j.helper=n;j.status='selected';j.events.push(['Klient wybrał wykonawcę',Date.now()]);save();jobDetail(id)}
function clientActions(j){let a='';if(['published','searching'].includes(j.status))a=`<div class="card stack"><button class="secondary" onclick="editPrice('${j.id}')">Zmień cenę</button><button class="danger" onclick="cancelJob('${j.id}')">Anuluj zlecenie</button></div>`;if(j.status==='awaiting')a=`<div class="card stack"><button class="ok" onclick="confirmComplete('${j.id}')">POTWIERDZAM WYKONANIE</button><button class="danger" onclick="problem('${j.id}')">ZGŁOŚ PROBLEM</button></div>`;if(j.status==='completed')a=`<div class="card"><h3>Oceń wykonawcę</h3><div class="grid2"><button class="secondary" onclick="rate('${j.id}',5)">⭐ 5</button><button class="secondary" onclick="rate('${j.id}',4)">⭐ 4</button></div></div>`;return a}
function helperActions(j){if(j.helper&&j.helper!==S.user.name)return '';let a='';if(j.status==='selected')a=`<div class="card stack"><button class="ok" onclick="advance('${j.id}','confirmed','Wykonawca potwierdził zlecenie')">POTWIERDZAM</button><button class="danger" onclick="decline('${j.id}')">NIE MOGĘ</button></div>`;else if(j.status==='confirmed')a=`<div class="card"><button onclick="advance('${j.id}','enroute','Wykonawca ruszył w drogę')">JADĘ</button></div>`;else if(j.status==='enroute')a=`<div class="card"><button onclick="advance('${j.id}','onsite','Wykonawca potwierdził obecność na miejscu (GPS – symulacja)')">JESTEM NA MIEJSCU</button></div>`;else if(j.status==='onsite')a=`<div class="card stack"><button onclick="advance('${j.id}','inprogress','Rozpoczęto zlecenie')">ROZPOCZNIJ ZLECENIE</button><button class="secondary" onclick="extra('${j.id}')">Zaproponuj dodatkową pracę</button></div>`;else if(j.status==='inprogress')a=`<div class="card stack"><button class="ok" onclick="advance('${j.id}','awaiting','Wykonawca oznaczył pracę jako zakończoną')">ZAKOŃCZYŁEM</button><button class="secondary" onclick="extra('${j.id}')">Dodatkowa praca / dopłata</button></div>`;return a}
function advance(id,s,msg){const j=S.jobs.find(x=>x.id===id);j.status=s;j.events.push([msg,Date.now()]);if(s==='awaiting')j.payment='awaiting_confirmation';save();jobDetail(id)}
function decline(id){const j=S.jobs.find(x=>x.id===id);j.status='published';j.helper=null;j.events.push(['Wybrany wykonawca odmówił',Date.now()]);save();home()}
function cancelJob(id){if(!confirm('Anulować zlecenie?'))return;const j=S.jobs.find(x=>x.id===id);j.status='cancelled';j.payment='released';j.events.push(['Zlecenie anulowano',Date.now()]);save();home()}
function editPrice(id){const j=S.jobs.find(x=>x.id===id);const p=Number(prompt('Nowa cena (€):',j.price));if(!p||p<=0)return;j.events.push([`Cena zmieniona z ${money(j.price)} na ${money(p)}`,Date.now()]);j.price=p;save();jobDetail(id)}
function extra(id){const j=S.jobs.find(x=>x.id===id);const p=Number(prompt('Kwota dopłaty (€):','5'));if(!p||p<=0)return;if(confirm(`Zaakceptować dodatkową pracę za ${money(p)}? (symulacja zgody obu stron)`)){j.events.push([`Dodatkowa praca zaakceptowana: +${money(p)}`,Date.now()]);j.price+=p;j.payment='authorization_updated';save();jobDetail(id)}}
function confirmComplete(id){const j=S.jobs.find(x=>x.id===id);j.status='completed';j.payment='paid';j.events.push(['Klient potwierdził wykonanie',Date.now()]);j.events.push(['Płatność rozliczona – symulacja',Date.now()]);save();jobDetail(id)}
function problem(id){const j=S.jobs.find(x=>x.id===id);j.status='dispute';j.payment='held';j.events.push(['Klient zgłosił problem – wypłata wstrzymana',Date.now()]);save();jobDetail(id)}
function rate(id,n){S.ratings.push({job:id,role:S.role,value:n,at:Date.now()});save();alert('Ocena zapisana w trybie testowym.');home()}
function messages(){bottom('msg');const j=job();main.innerHTML=`<section class="screen"><h1>Wiadomości</h1>${j?`<div class="card"><h3>${esc(j.category)}</h3><div id="chat" class="stack"><div class="notice">Czat testowy jest lokalny na tym urządzeniu. Synchronizację między telefonami podłączymy przez backend w następnym kroku technicznym.</div></div><label class="top-space">Wiadomość<input id="chatMsg" placeholder="Napisz wiadomość"></label><button class="top-space" onclick="sendChat()">Wyślij</button></div>`:`<div class="card muted">Brak aktywnego zlecenia.</div>`}</section>`}
function sendChat(){if(!chatMsg.value.trim())return;alert('Wiadomość zapisana lokalnie w prototypie.');chatMsg.value=''}
function earnings(){bottom('earn');const done=S.jobs.filter(j=>j.helper===S.user.name&&j.status==='completed');const total=done.reduce((a,j)=>a+j.price*.9,0);main.innerHTML=`<section class="screen"><h1>Zarobki</h1><div class="card"><div class="muted small">Szacunkowo w MVP</div><div class="money">${money(total)}</div></div>${done.map(j=>`<div class="card">${jobCard(j,false)}</div>`).join('')||'<div class="card muted">Brak zakończonych zleceń.</div>'}</section>`}
function profile(){bottom('profile');main.innerHTML=`<section class="screen"><h1>${t('profile')}</h1><div class="card"><h2>${esc(S.user.name)}</h2><div class="muted">${esc(S.user.email||'')}<br>${esc(S.user.phone||'')}<br>${esc(S.user.city||'')}</div><div class="sep"></div><span class="tag">e-mail ✓</span><span class="tag">telefon ✓</span><span class="tag">KYC – test</span><div class="sep"></div><div class="row between"><span>${t('language')}</span><strong>${S.lang==='de'?'Deutsch':S.lang==='en'?'English':'Polski'}</strong></div></div><div class="card stack"><button class="secondary" onclick="S.role=null;save();chooseRole()">${t('switchRole')}</button><button class="secondary" onclick="S.lang=null;save();render()">${t('changeLanguage')}</button><button class="secondary" onclick="exportState()">${t('export')}</button><button class="danger" onclick="reset()">${t('clear')}</button></div></section>`}
function exportState(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='rebu-mvp-test.json';a.click();URL.revokeObjectURL(u)}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();
</script>
</body>
</html>
